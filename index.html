<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentin?</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1a0f2e;
      --card:#111833cc;
      --text:#f7f7fb;
      --muted:#c9c9d6;
      --yes:#22c55e;
      --maybe:#a855f7;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, #ff2d8a33, transparent 60%),
        radial-gradient(900px 600px at 80% 20%, #7c3aed33, transparent 55%),
        radial-gradient(900px 700px at 50% 85%, #22c55e22, transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .card{
      width:min(720px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .top{
      padding:28px 24px 18px;
      text-align:center;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .2px;
    }

    .sub{
      margin:0;
      color: var(--muted);
      font-size: 15px;
      line-height:1.35;
    }

    .media{
      display:grid;
      place-items:center;
      padding: 8px 24px 0;
    }

    .photo{
      width:min(520px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
      overflow:hidden;
      position:relative;
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .photo .placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:16px;
      text-align:center;
      color: rgba(255,255,255,.75);
      font-size:14px;
    }

    .controls{
      padding: 22px 24px 26px;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
    }

    .btnRow{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      appearance:none;
      border:none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 650;
      color: #061014;
      cursor:pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
      user-select:none;
      will-change: transform;
    }

    button:active{ transform: translateY(1px); }
    button:focus{ outline: 3px solid rgba(255,255,255,.35); outline-offset: 3px; }

    #yesBtn{
      background: linear-gradient(135deg, #34d399, var(--yes));
      transform: scale(1);
    }

    #maybeBtn{
      background: linear-gradient(135deg, #c084fc, var(--maybe));
      color: #12051e;
    }

    .hint{
      color: rgba(255,255,255,.75);
      font-size: 13px;
      margin:0;
    }

    .result{
      display:none;
      margin-top: 10px;
      padding: 14px 16px;
      width:min(520px, 100%);
      background: rgba(34,197,94,.14);
      border: 1px solid rgba(34,197,94,.25);
      border-radius: 14px;
      text-align:center;
    }

    .result p{
      margin:0;
      font-size: 15px;
      line-height:1.35;
    }

    .tiny{
      margin-top:10px;
      opacity:.72;
      font-size:12px;
    }

    /* FULDSKÆRMS “JUBIIIIIIIIIII” */
    .celebrate{
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.55);
      z-index: 9999;
      backdrop-filter: blur(6px);
    }

    .celebrateText{
      font-size: clamp(44px, 8vw, 120px);
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 18px 60px rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="top">
      <h1>Vil du være min valentin?</h1>
      <p class="sub">Du må gerne vælge “Måske”, men… det bliver hurtigt besværligt.</p>
    </section>

    <section class="media">
      <div class="photo">
        <!-- Læg dit billede/GIF i samme mappe og omdøb til "billede.jpg" (eller "billede.gif")
             og ret src herunder hvis nødvendigt. -->
        <img id="heroImg" src="billede.jpg" alt="" onerror="this.style.display='none';document.getElementById('ph').style.display='grid';">
        <div id="ph" class="placeholder" style="display:none;">
          <div>
            <div style="font-weight:650; margin-bottom:6px;">(Plads til billede)</div>
            <div>Upload et billede og kald det <code>billede.jpg</code> (eller ret <code>src</code>), så dukker det op her.</div>
          </div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="btnRow" id="btnRow">
        <button id="yesBtn" type="button">Ja</button>
        <button id="maybeBtn" type="button">Måske</button>
      </div>

      <p class="hint" id="hint">Tip: “Måske” gør “Ja” mere og mere fristende.</p>

      <div class="result" id="result">
        <p id="resultText"></p>
        <div class="tiny" id="tiny"></div>
      </div>
    </section>
  </main>

  <!-- Overlay der vises når hun trykker JA -->
  <div id="celebrate" class="celebrate" aria-hidden="true">
    <div class="celebrateText">JUBIIIIIIIIIII</div>
  </div>

  <script>
    (function(){
      const yesBtn = document.getElementById("yesBtn");
      const maybeBtn = document.getElementById("maybeBtn");
      const result = document.getElementById("result");
      const resultText = document.getElementById("resultText");
      const tiny = document.getElementById("tiny");
      const hint = document.getElementById("hint");
      const celebrate = document.getElementById("celebrate");

      let scale = 1.0;
      let maybeCount = 0;

      function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

      function applyYesScale(){
        yesBtn.style.transform = "scale(" + scale.toFixed(2) + ")";
      }

      function showResult(msg, small){
        result.style.display = "block";
        resultText.textContent = msg;
        tiny.textContent = small || "";
      }

      yesBtn.addEventListener("click", () => {
        showResult("Yesss. Så er det en aftale.", maybeCount > 0 ? ("(Du nåede “Måske” " + maybeCount + " gang(e).)") : "");
        hint.textContent = "Godt valg.";
        maybeBtn.disabled = true;
        yesBtn.disabled = true;
        yesBtn.style.filter = "brightness(1.05)";
        maybeBtn.style.opacity = "0.55";

        celebrate.style.display = "grid";
        celebrate.setAttribute("aria-hidden", "false");
      });

      maybeBtn.addEventListener("click", () => {
        maybeCount += 1;

        const growth = maybeCount <= 4 ? 1.18 : 1.25;
        scale = clamp(scale * growth, 1.0, 5.0);
        applyYesScale();

        const lines = [
          "Måske… . Prøv igen.",
          "Interessant. “Ja” ser større ud nu.",
          "Du kan stadig nå at vælge rigtigt.",
          "Det her er et tegn.",
          "Okay, nu er “Ja” nærmest magnetisk."
        ];
        hint.textContent = lines[Math.min(maybeCount - 1, lines.length - 1)];

        if (scale >= 3.2) maybeBtn.style.opacity = "0.6";
        if (scale >= 4.2) maybeBtn.style.opacity = "0.45";
      });

      /* Klik på overlay = luk (valgfrit, men meget rart) */
      celebrate.addEventListener("click", (e) => {
        e.currentTarget.style.display = "none";
        e.currentTarget.setAttribute("aria-hidden", "true");
      });

      applyYesScale();
    })();
  </script>
</body>
</html>
